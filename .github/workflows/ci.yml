# Generated by the pinned ci-cd-workflows template renderer.
# Project-owned annotations: preserve these when regenerating; the v1 renderer
# emits workflow structure without comments. See docs/delivery.md for operations.
# Shared foundation owns the release sequence; Portfolio owns its tests/adapters.
name: CI
on:
  # Shared: PRs verify only; native required checks/reviews gate a human merge.
  pull_request: null
  # Shared: recheck the exact main commit after merge before delivering dev.
  # A green PR run is not deployment evidence for the merged commit.
  push:
    branches:
      - main
  # Shared: exact merged SHA for dev revalidation/recovery, never production.
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged source SHA to revalidate and redeploy in dev
        type: string
        required: true
# Shared: read source and Actions evidence; no merge or administration permission.
permissions:
  contents: read
  actions: read
jobs:
  # Shared: immutable web verification runs the package hooks and retains output.
  # Project: ci:quality runs format/code/docs lint, full+production audits, unit
  # tests and the version/type-checked build. ci:browser then tests those bytes.
  # Project: core HTML journeys run in Chromium, Firefox and WebKit; specialized
  # 3D/GPU suites retain their full Chromium coverage (playwright.config.ts).
  # Project settings and legacy check names are declared in .github/ci-cd.json.
  verify:
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-web.yml@d7d0c297f0b4038e9815349fd16f79bb92d77ceb
    with:
      # Shared: implementation checkout and workflow use the same immutable pin.
      automation_sha: d7d0c297f0b4038e9815349fd16f79bb92d77ceb
      # Shared: manual SHA or the exact PR/main event revision, never latest main.
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      # Project: keep Portfolio's pinned supported runtime.
      node_version: 24.21.0
  # Shared: only successful main push/manual dev verification can deliver dev.
  # The called job binds dev, checks artifact integrity/freshness and
  # retains delivery evidence. PRs cannot deploy; dev has no boolean opt-in.
  # Project: scripts/ci-deploy.mjs delegates to the existing delivery controller
  # for static Vercel packaging, noindex/routing/identity smoke and recovery IDs.
  # Project: DEPLOY_ENABLED/DELIVERY_ENABLED apply only to production;
  # this caller does not migrate remote settings or production approval.
  deploy_dev:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-web.yml@d7d0c297f0b4038e9815349fd16f79bb92d77ceb
    with:
      automation_sha: d7d0c297f0b4038e9815349fd16f79bb92d77ceb
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      node_version: 24.21.0
      # Project exception: preserve stricter exclusion across BOTH targets.
      # Production uses this same all-target lock; active mutations are not cancelled.
      lock_scope: all
    # Shared: named provider secrets reach the selected deployment job only.
    # Verification runs without these credentials; environment rules live in GitHub.
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SMOKE_BYPASS: ${{ secrets.SMOKE_BYPASS }}
  # Project: Foundation quality is still required by native branch protection.
  # Shared: mirror verify even on failure; do not rerun the suite or report a skip.
  legacy_0:
    name: Foundation quality
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "$VERIFY_RESULT" = success
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
