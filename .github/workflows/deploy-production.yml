# Generated by the pinned ci-cd-workflows template renderer.
# Project-owned annotations: preserve these when regenerating; the v1 renderer
# emits structure without comments. Operator acceptance/recovery: docs/delivery.md.
name: Deploy production
on:
  # Shared: manual production entry point, separate from automatic main-to-dev.
  # Dispatch from main with a full merged SHA, never a branch/tag or latest fallback.
  workflow_dispatch:
    inputs:
      # Shared: successful retained dev delivery must match this exact source.
      # The owner separately reviews actual dev acceptance and recovery eligibility.
      sha:
        description: Exact merged source SHA already delivered and accepted in dev
        type: string
        required: true
# Shared: read source ancestry and Actions evidence; no merge/admin writes.
permissions:
  contents: read
  actions: read
jobs:
  # Shared: validate merged source/dev evidence, then verify the production-configured
  # candidate without deployment secrets. Retain and later deploy the checked output.
  # Project: package.json owns full+production audits, code/docs/format/unit/build
  # checks and browser coverage: three-engine core flows plus Chromium 3D/GPU suites.
  # The production path does not replace or weaken Portfolio's existing test gate.
  verify_release:
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-web.yml@d7d0c297f0b4038e9815349fd16f79bb92d77ceb
    with:
      # Shared: implementation checkout matches the immutable reusable workflow pin.
      automation_sha: d7d0c297f0b4038e9815349fd16f79bb92d77ceb
      source_sha: ${{ inputs.sha }}
      # Shared: use declared production inputs; dev bytes are not assumed identical.
      environment: production
      node_version: 24.21.0
  # Shared: after verification, the called job binds production and waits for native
  # approval. Reviewer/main-only/no-bypass policy is configured in GitHub settings.
  # It rechecks exact dev evidence/artifact identity after approval and honors the
  # enable switch; approving or dispatching does not implicitly enable a target.
  # Project: ci-deploy.mjs retains the existing static Vercel controller, noindex,
  # routing/identity smoke and prior deployment evidence. DELIVERY_ENABLED remains
  # the documented compatibility fallback when DEPLOY_ENABLED is not configured.
  # Failed/uncertain mutations are not blindly retried or automatically rolled back;
  # a new production attempt needs investigation, fresh dispatch and fresh approval.
  deploy_production:
    needs: verify_release
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-web.yml@d7d0c297f0b4038e9815349fd16f79bb92d77ceb
    with:
      automation_sha: d7d0c297f0b4038e9815349fd16f79bb92d77ceb
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: 24.21.0
      # Project exception: same cross-target lock as dev, not independent locks.
      # Preserve exclusion for all future delivery/recovery writers too.
      lock_scope: all
    # Shared: selected production provider token and optional smoke bypass only.
    # Candidate verification has neither; no dev-verification token/PAT is required.
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SMOKE_BYPASS: ${{ secrets.SMOKE_BYPASS }}
