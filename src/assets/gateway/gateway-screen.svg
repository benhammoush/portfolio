      >
        EXAMPLE CHECKOUT
      </text>
      <text x="670" y="233" fill="#172f38" font-size="24" font-weight="600">
        Review payment
      </text>
      <text x="670" y="260" fill="#4c666e" font-size="13">
        An illustrative order, not a real invoice.
      </text>
      <path d="M670 282h309" stroke="#bccdd0"></path>
      <text x="670" y="318" fill="#48626d" font-size="13">Order</text>
      <text x="979" y="318" text-anchor="end" fill="#203e48" font-size="14">
        DEMO-001
      </text>
      <text x="670" y="354" fill="#48626d" font-size="13">Amount</text>
      <text x="979" y="354" text-anchor="end" fill="#203e48" font-size="14">
        Example only
      </text>
      <rect
        x="670"
        y="383"
        width="309"
        height="58"
        rx="10"
