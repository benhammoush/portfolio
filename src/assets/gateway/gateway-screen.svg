      <g>
        <rect
          x="36"
          y="322"
          width="577"
          height="94"
          rx="12"
          fill="#203942"
          stroke="#45616e"
        ></rect>
        <rect
          x="54"
          y="342"
          width="45"
          height="45"
          rx="12"
          fill="#315769"
        ></rect>
        <text x="76" y="371" text-anchor="middle" fill="#b6dfff" font-size="16">
          02
        </text>
        <text x="118" y="356" fill="#e6f0f5" font-size="18" font-weight="600">
          Customer wallet
        </text>
        <text x="118" y="384" fill="#bdced7" font-size="13">
          Signing stays with the customer.
        </text>
        <path
          d="M76 421v15m-5-5 5 5 5-5"
          stroke="#83b6d4"
          fill="none"
          stroke-width="2"
        ></path>
      </g>
      <g>
        <rect
          x="36"
          y="442"
          width="577"
          height="94"
          rx="12"
          fill="#203942"
          stroke="#45616e"
        ></rect>
        <rect
          x="54"
          y="462"
          width="45"
          height="45"
          rx="12"
          fill="#315769"
        ></rect>
        <text x="76" y="491" text-anchor="middle" fill="#b6dfff" font-size="16">
          03
        </text>
        <text x="118" y="476" fill="#e6f0f5" font-size="18" font-weight="600">
          Backend verification
        </text>
        <text x="118" y="504" fill="#bdced7" font-size="13">
          Verify the transaction independently.
        </text>
      </g>
      <text x="36" y="592" fill="#bed1d8" font-size="12">
        Repeated requests · interrupted checkouts · uncertain outcomes
      </text>
    </g>
    <text
