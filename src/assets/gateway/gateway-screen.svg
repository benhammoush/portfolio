<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1040"
  height="640"
  viewBox="0 0 1040 640"
  aria-hidden="true"
>
  <rect width="1040" height="640" rx="12" fill="#14272d"></rect>
  <path d="M0 50h1040" stroke="#40545d"></path>
  <g font-family="system-ui, sans-serif">
    <circle cx="30" cy="25" r="7" fill="#8cc8f4"></circle>
    <text
      x="49"
      y="31"
      fill="#8cc8f4"
      font-size="15"
      font-weight="700"
