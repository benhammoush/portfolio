<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1440"
  height="1520"
  viewBox="0 0 1440 1520"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Portfolio section composition contact sheet</title>
  <desc id="description">
    Six rows in approved section order with entry, reading and exit frames. Each
    outlined thumbnail represents the whole browser viewport, not an embedded
    canvas. Product evidence is represented by labeled placeholders, not actual
    screenshots. No 3D object is selected.
  </desc>
  <defs>
    <style>
      text {
        font-family: system-ui, sans-serif;
        fill: #24372e;
      }
      .label {
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 1px;
        fill: #77513c;
      }
      .heading {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }
      .copy {
        font-size: 12px;
        fill: #526358;
      }
      .micro {
        font-size: 9px;
        fill: #526358;
      }
      .rule {
        stroke: #c5cfc3;
        fill: none;
      }
      .viewport {
        fill: #f8f9f4;
        stroke: #bcc9ba;
      }
      .placeholder {
        fill: #e3e9df;
        stroke: #a9bba5;
        stroke-dasharray: 4 4;
      }
      .line {
        stroke: #9eafa0;
        stroke-width: 2;
      }
      .signal {
        stroke: #ac744c;
        stroke-width: 2;
      }
    </style>
    <g id="viewport">
      <rect class="viewport" width="400" height="155" />
      <path d="M0 135 Q120 110 220 130 T400 110" class="rule" />
      <path d="M140 0 Q220 60 400 45" class="rule" opacity=".5" />
    </g>
    <g id="intro">
      <use href="#viewport" />
      <text x="22" y="28" class="label">GUILLAUME AMMOUCHE</text>
      <text x="22" y="67" class="heading">From interface</text>
      <text x="22" y="92" class="heading">to production.</text>
      <text x="22" y="118" class="micro">
        Full-stack developer / Explore / Contact
      </text>
    </g>
    <g id="workflow">
      <use href="#viewport" />
      <text x="24" y="30" class="label">ENGINEERING WORKFLOW</text>
      <text x="24" y="67" class="copy">Define</text>
      <text x="123" y="67" class="copy">Build + verify</text>
      <text x="260" y="67" class="copy">Accept + deliver</text>
      <path d="M25 82H373" class="line" />
      <path d="M123 78v8m137-8v8" class="signal" />
      <text x="24" y="109" class="micro">
        Sanitized foundation trace / Human responsibility
      </text>
    </g>
    <g id="apollo">
      <use href="#viewport" />
      <text x="20" y="27" class="label">APOLLO</text>
      <rect x="118" y="40" width="260" height="86" class="placeholder" />
      <text x="146" y="78" class="copy">Reviewed video still / excerpt</text>
      <text x="146" y="97" class="micro">
        Not captured or approved in this step
      </text>
      <text x="20" y="70" class="micro">Problem</text>
      <text x="20" y="86" class="micro">Contribution</text>
      <text x="20" y="102" class="micro">Decision</text>
    </g>
    <g id="iris">
      <use href="#viewport" />
      <rect x="22" y="28" width="225" height="102" class="placeholder" />
      <text x="40" y="67" class="copy">Real public-wallet UI</text>
      <text x="40" y="87" class="micro">
        Capture pending / Original UI colors
      </text>
      <text x="269" y="40" class="label">IRIS</text>
      <text x="269" y="71" class="copy">Unpriced</text>
      <text x="269" y="89" class="copy">is not zero.</text>
      <text x="269" y="117" class="micro">Read-only journey</text>
    </g>
    <g id="gateway">
      <use href="#viewport" />
      <text x="20" y="26" class="label">CRYPTO GATEWAY / DEVNET ONLY</text>
      <rect x="20" y="43" width="122" height="86" class="placeholder" />
      <text x="36" y="75" class="copy">Real checkout</text>
      <text x="36" y="94" class="micro">Capture pending</text>
      <text x="161" y="55" class="micro">Awaiting wallet approval</text>
      <text x="161" y="76" class="micro">Transaction submitted</text>
      <text x="161" y="97" class="micro">Verifying on-chain</text>
      <text x="161" y="118" class="micro">Payment verified</text>
      <path d="M152 49v73" class="signal" />
    </g>
    <g id="contact">
      <use href="#viewport" />
      <text x="22" y="30" class="label">CONTACT</text>
      <text x="22" y="70" class="heading">Let’s build something reliable.</text>
      <text x="22" y="100" class="copy">Approved email / Ordinary links</text>
      <text x="22" y="123" class="micro">
        Quiet composition / No final animation barrier
      </text>
    </g>
  </defs>
  <rect width="1440" height="1520" fill="#eef1e9" />
  <text x="44" y="49" font-size="29" font-weight="600">
    Section frames, before objects.
  </text>
  <text x="44" y="78" class="copy">
    Layout proposals only. Every thumbnail is a whole-page viewport; evidence
    placeholders are not product screenshots.
  </text>
  <text x="130" y="124" class="label">ENTRY</text>
  <text x="550" y="124" class="label">READING VIEW</text>
  <text x="970" y="124" class="label">EXIT / HANDOFF</text>

  <text x="44" y="166" class="label">01</text>
  <g transform="translate(130 143)"><use href="#intro" /></g>
  <g transform="translate(550 143)">
    <use href="#intro" />
    <text x="259" y="70" class="micro">Open world.</text>
    <text x="259" y="87" class="micro">No project object</text>
    <text x="259" y="104" class="micro">selected yet.</text>
  </g>
  <g transform="translate(970 143)">
    <use href="#viewport" />
    <text x="22" y="44" class="label">FROM WHAT → HOW</text>
    <text x="22" y="84" class="heading">How the work gets delivered.</text>
    <text x="22" y="112" class="micro">Natural scroll into the method</text>
  </g>
  <text x="130" y="322" class="copy">
    Introduction — identity, positioning and an immediate contact action.
  </text>

  <text x="44" y="376" class="label">02</text>
  <g transform="translate(130 353)">
    <use href="#viewport" />
    <text x="22" y="44" class="label">ENGINEERING WORKFLOW</text>
    <text x="22" y="83" class="heading">Intent → checked result.</text>
    <text x="22" y="112" class="micro">
      Short editorial interlude, not a process dashboard
    </text>
  </g>
  <g transform="translate(550 353)"><use href="#workflow" /></g>
  <g transform="translate(970 353)">
    <use href="#viewport" />
    <text x="22" y="44" class="label">SEE THE METHOD IN CONTEXT</text>
    <text x="22" y="87" class="heading">Apollo</text>
    <text x="22" y="113" class="micro">First project reveal</text>
  </g>
  <text x="130" y="532" class="copy">
    Engineering workflow — compact checkpoints, one evidence trace, AI in a
    supporting role.
  </text>

  <text x="44" y="586" class="label">03</text>
  <g transform="translate(130 563)">
    <use href="#viewport" />
    <text x="22" y="44" class="label">APOLLO</text>
    <text x="22" y="81" class="heading">A coherent system.</text>
    <text x="22" y="110" class="micro">
      Problem + author contribution, disclosure-gated
    </text>
  </g>
  <g transform="translate(550 563)"><use href="#apollo" /></g>
  <g transform="translate(970 563)">
    <use href="#viewport" />
    <text x="22" y="43" class="label">SYSTEMS → INFORMATION</text>
    <text x="22" y="82" class="heading">From complexity to clarity.</text>
    <text x="22" y="112" class="micro">One approved takeaway, then Iris</text>
  </g>
  <text x="130" y="742" class="copy">
    Apollo — approved evidence leads; no speculative terminal walls or private
    architecture.
  </text>

  <text x="44" y="796" class="label">04</text>
  <g transform="translate(130 773)">
    <use href="#viewport" />
    <text x="22" y="35" class="label">IRIS / PUBLIC-WALLET EXPLORATION</text>
    <text x="22" y="72" class="heading">An address.</text>
    <text x="22" y="99" class="heading">An understandable view.</text>
    <text x="22" y="127" class="micro">No wallet connection or signature</text>
  </g>
  <g transform="translate(550 773)"><use href="#iris" /></g>
  <g transform="translate(970 773)">
    <use href="#viewport" />
    <text x="22" y="43" class="label">INTERPRETING → VERIFYING</text>
    <text x="22" y="81" class="heading">Know what the state means.</text>
    <text x="22" y="110" class="micro">Hand off to payment-state clarity</text>
  </g>
  <text x="130" y="952" class="copy">
    Iris — actual UI hierarchy and a supported journey, not another abstract
    glass instrument.
  </text>

  <text x="44" y="1006" class="label">05</text>
  <g transform="translate(130 983)">
    <use href="#viewport" />
    <text x="22" y="43" class="label">CRYPTO GATEWAY / SOLANA DEVNET</text>
    <text x="22" y="81" class="heading">Payment states, made explicit.</text>
    <text x="22" y="110" class="micro">
      Standalone checkout / No real funds / No shop
    </text>
  </g>
  <g transform="translate(550 983)"><use href="#gateway" /></g>
  <g transform="translate(970 983)">
    <use href="#viewport" />
    <text x="22" y="43" class="label">SUBMISSION ≠ SETTLEMENT</text>
    <text x="22" y="81" class="heading">Verify the result.</text>
    <text x="22" y="110" class="micro">
      No fabricated success or celebration loop
    </text>
  </g>
  <text x="130" y="1162" class="copy">
    Crypto gateway — exact source-backed states, without legacy Shopify/order
    claims.
  </text>

  <text x="44" y="1216" class="label">06</text>
  <g transform="translate(130 1193)">
    <use href="#viewport" />
    <text x="22" y="35" class="label">BACK TO THE PERSON</text>
    <text x="22" y="72" class="heading">A conversation.</text>
    <text x="22" y="99" class="heading">Not another exhibit.</text>
    <text x="22" y="127" class="micro">Reduce visual competition</text>
  </g>
  <g transform="translate(550 1193)"><use href="#contact" /></g>
  <g transform="translate(970 1193)">
    <use href="#viewport" />
    <text x="22" y="43" class="label">NO FORCED ENDING</text>
    <text x="22" y="81" class="heading">Contact. Revisit. Leave normally.</text>
    <text x="22" y="110" class="micro">
      Native navigation and email remain usable
    </text>
  </g>
  <text x="130" y="1372" class="copy">
    Contact — a calm conclusion within the same space, with no new object to
    decode.
  </text>
  <path d="M44 1414H1396" class="rule" />
  <text x="44" y="1445" class="copy">
    Next checkpoint: approve content anchors and composition before selecting
    objects, materials or camera choreography.
  </text>
  <text x="44" y="1472" class="micro">
    Source/test inspection is not live acceptance. Actual screenshots and Apollo
    excerpts remain review-gated. No project code or transactions changed.
  </text>
</svg>
